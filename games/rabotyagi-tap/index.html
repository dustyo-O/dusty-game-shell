<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Работяги: Смена</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #1c1f1a;
        color: #e8e6da;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 16px;
        box-sizing: border-box;
      }
      canvas {
        image-rendering: pixelated;
        max-width: 100%;
        max-height: 55vh;
        touch-action: manipulation;
        cursor: pointer;
        border: 2px solid #4a4632;
        border-radius: 4px;
      }
      #hud {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        text-align: center;
        max-width: 480px;
      }
      #title {
        font-size: 15px;
        font-weight: 700;
        color: #e8c547;
        letter-spacing: 0.5px;
      }
      #status {
        min-height: 18px;
      }
      #shared-run {
        color: #e8c547;
        min-height: 16px;
      }
      #leaderboard {
        list-style: decimal;
        padding: 0 0 0 18px;
        margin: 0;
        font-size: 13px;
        color: #a8a48c;
        text-align: left;
      }
      #leaderboard-label {
        color: #a8a48c;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #4a4632;
        background: #33301f;
        color: #e8e6da;
        cursor: pointer;
      }
      button:active {
        background: #4a4632;
      }
      #footer {
        font-size: 11px;
        color: #6b6852;
        max-width: 480px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="title">РАБОТЯГИ: СМЕНА НА ДОЛБИЛЬНЕ</div>
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud">
      <div id="status">жми по коту — начинай смену</div>
      <div id="shared-run"></div>
      <button id="share-btn" type="button">Скопировать вызов</button>
      <div id="leaderboard-label">Доска почёта</div>
      <ol id="leaderboard"></ol>
    </div>
    <div id="footer">
      Прототип по мотивам фольклора "коты ишачат на заводе" — внутренний плейтест,
      не для публикации без согласия сообщества.
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
