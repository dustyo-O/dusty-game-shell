<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Community Game</title>
    <style>
      html, body {
        margin: 0;
        min-height: 100%;
        background: #0b0b12;
        color: #f5f5f5;
        font-family: system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 16px;
        box-sizing: border-box;
      }
      canvas {
        image-rendering: pixelated;
        max-width: 100%;
        max-height: 60vh;
        touch-action: manipulation;
      }
      #hud {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-size: 14px;
      }
      #leaderboard {
        list-style: none;
        padding: 0;
        margin: 0;
        font-size: 13px;
        color: #94a3b8;
        text-align: center;
      }
      button {
        font: inherit;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #f5f5f5;
        cursor: pointer;
      }
      button:active {
        background: #334155;
      }
    </style>
  </head>
  <body>
    <canvas id="game" width="480" height="270"></canvas>
    <div id="hud">
      <div id="status">click/tap the canvas to score</div>
      <div id="shared-run"></div>
      <button id="share-btn" type="button">Copy share link</button>
      <ol id="leaderboard"></ol>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
