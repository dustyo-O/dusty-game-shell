name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=games/hello-world
      - run: npm run build --workspace=games/template
      - run: npm run build --workspace=games/rabotyagi-tap
      - run: npm run build --workspace=games/judgment-loop
      - name: Assemble site
        run: |
          mkdir -p site/template site/rabotyagi-tap site/judgment-loop
          cp -r games/hello-world/dist/. site/
          cp -r games/template/dist/. site/template/
          cp -r games/rabotyagi-tap/dist/. site/rabotyagi-tap/
          cp -r games/judgment-loop/dist/. site/judgment-loop/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
